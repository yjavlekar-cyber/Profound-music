on:
  push:
    branches: 
      - main
    paths-ignore:
      - 'README.md'
      - '.github/workflows/ci.yaml'
      - 'k8s/values.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: set up node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: build
        run: npm run build

      - name: run tests
        run: npm test

  code-quality:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout-code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  build-and-push-to-dockerhub-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v3

      - name: login-to-dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build-and-push-frontend-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: ${{ secrets.DOCKER_USERNAME }}/my-frontend:${{ github.run_id }}

  build-and-push-to-dockerhub-backend:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v3

      - name: login-to-dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build-and-push-backend-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          context: ./backend 
          file: ./backend/Dockerfile
          tags: ${{ secrets.DOCKER_USERNAME }}/my-backend:${{ github.run_id }}

  update-helm-chart:
    runs-on: ubuntu-latest

    needs: [build-and-push-to-dockerhub-frontend, build-and-push-to-dockerhub-backend]

    
    steps:
      - name: Checkout-code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm Chart
        run: |
          sed -i '/^backend:/{n;s|repository:.*|repository: ${{ secrets.DOCKERHUB_USERNAME }}/my-backend|;n;s|tag:.*|tag: "${{ github.run_id }}"|;}' k8s/values.yaml
          sed -i '/^frontend:/{n;s|repository:.*|repository: ${{ secrets.DOCKERHUB_USERNAME }}/my-frontend|;n;s|tag:.*|tag: "${{ github.run_id }}"|;}' k8s/values.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Yogesh Jawlekar"
          git config --global user.email "yjavlekar@gmail.com"
          git add k8s/values.yaml
          git commit -m "Update Helm chart with new image tags"
          git push origin main